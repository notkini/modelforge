[pytest]
# The active ModelForge backend suite lives in backend/ (test_*.py files).
# legacy/ holds the superseded prompt-to-image prototype (see legacy/README.md).
# Its archived tests import the removed `app` package and cannot run in this
# layout; they are reference material only and stay out of discovery.
testpaths = backend
norecursedirs = legacy .* build dist node_modules venv
